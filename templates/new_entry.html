{% extends "base.html" %}

{% block title %}Neuer Eintrag – Tagebuch{% endblock %}

{% block content %}

<div class="container">

    <div class="card diary-card">
        <h1>Neuer Tagebucheintrag</h1>
        <p class="subtitle">Was bewegte dich heute?</p>

        <a class="back-link" href="{{ url_for('overview') }}">← Zur Übersicht</a>

        {% if fehler %}
            <p class="error">{{ fehler }}</p>
        {% endif %}

        <form method="POST" class="diary-form">

            <div class="form-group">
                <label for="title">Titel</label>
                <input 
                    type="text" 
                    id="title"
                    name="title" 
                    placeholder="Titel des Eintrags…" 
                    required>
            </div>

            <div class="form-group">
                <label for="date">Datum</label>
                <input 
                    type="date" 
                    id="date"
                    name="date" 
                    value="{{ today }}">
            </div>

            <div class="form-group">
                <label for="content">Gedanken</label>
                <textarea 
                    id="content"
                    name="content" 
                    rows="8" 
                    placeholder="Schreibe hier deine Gedanken, Erlebnisse und Reflexionen…" 
                    required></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">Eintrag speichern</button>
                <a class="btn-cancel" href="{{ url_for('overview') }}">Abbrechen</a>
            </div>

        </form>
    </div>

</div>

{% endblock %}
