{% extends "base.html" %}

{% block title %}Neuer Eintrag – Tagebuch{% endblock %}

{% block content %}

<h1>Neuer Eintrag</h1>
<p>Was bewegte dich heute?</p>

<a href="{{ url_for('overview') }}">← Zurück</a>

{% if fehler %}
    <p style="color:red;">{{ fehler }}</p>
{% endif %}

<form method="POST">

    <label>Titel</label><br>
    <input type="text" name="title" placeholder="Titel des Eintrags…" required><br><br>

    <label>Datum</label><br>
    <input type="date" name="date" value="{{ today }}"><br><br>

    <label>Gedanken</label><br>
    <textarea name="content" rows="8" placeholder="Schreibe hier deine Gedanken, Erlebnisse und Reflexionen…" required></textarea><br><br>

    <button type="submit">Eintrag speichern</button>
    <a href="{{ url_for('overview') }}">Abbrechen</a>

</form>

{% endblock %}
