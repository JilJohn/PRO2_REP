{% extends "base.html" %}

{% block title %}Anmelden – Tagebuch{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 56px); display: flex; align-items: center; justify-content: center; padding: 40px 24px; margin: -40px -24px;">
  <div style="background: var(--paper); border: 1px solid var(--border); border-radius: 4px; padding: 44px 48px; width: 100%; max-width: 420px; box-shadow: 0 4px 24px var(--shadow);">
    <div style="font-size: 2rem; font-weight: 700; text-align: center; margin-bottom: 24px;"><span style="color: var(--accent2);">Tagebuch</span></div>

    {% if fehler %}
      <div class="alert alert-error">{{ fehler }}</div>
    {% endif %}

    <form method="post">
      <div class="form-group">
        <label for="username">Benutzername</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">Passwort</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Anmelden</button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--muted);">
      Noch kein Konto? <a href="{{ url_for('register') }}">Registrieren</a>
    </div>
  </div>
</div>
{% endblock %}
