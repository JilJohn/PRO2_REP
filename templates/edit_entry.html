{% extends "base.html" %}

{% block title %}Eintrag bearbeiten – Tagebuch{% endblock %}

{% block content %}
<div class="page-header flex-between">
  <!--Erste Zeile, Titel -->
  <h1>Eintrag bearbeiten</h1>
  <!-- zurück Button -->
  <a href="{{ url_for('overview') }}" class="btn btn-secondary">← Zurück</a>
</div>

{% if fehler %}<div class="alert alert-error">{{ fehler }}</div>{% endif %}

<!-- FORMULAR: Bearbeiten eines bestehenden Eintrags -->
<!-- Methode POST → Daten werden ans Backend gesendet -->
<form method="POST" style="margin-bottom: 32px;">
  
  <!-- Kästchen Titel-->
  <div class="form-group">
    <label>Titel</label>
    <!-- Textfeld-->
    <input type="text" name="title" value="{{ entry.title }}" required>
  </div>
  <!-- Kästchen Datum -->
  <div class="form-group">
    <label>Datum</label>
    <input type="date" name="date" value="{{ entry.date.strftime('%Y-%m-%d') }}" required>
  <!-- Backend muss datetime -> string umwandeln -->
  </div>
  <!-- Kästchen Inhalt -->
  <div class="form-group">
    <label>Inhalt</label>
    <textarea name="content" rows="8" required>{{ entry.content }}</textarea>
  </div>
  <!-- speichern oder abbrechen button-->
  <div style="display: flex; gap: 12px;">
    <!-- führt POST-Request aus → aktualisiert Eintrag im Backend -->
    <button type="submit" class="btn btn-primary">Speichern</button>
    <!-- bricht Bearbeitung ab → zurück zur Übersicht -->
    <a href="{{ url_for('overview') }}" class="btn btn-secondary">Abbrechen</a>
  </div>
</form>

<!-- LÖSCHEN-FORMULAR (eigener Button) -->
<!-- wichtig: eigener POST-Endpunkt nur für Delete -->
<form method="POST" action="{{ url_for('delete_entry', entry_id=entry.id) }}" onsubmit="return confirm('Eintrag wirklich löschen?');">
  <button type="submit" class="btn btn-danger">Eintrag löschen</button>
</form>
{% endblock %}
