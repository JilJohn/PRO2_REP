{% extends "base.html" %}

{% block title %}Registrieren – Tagebuch{% endblock %}

{% block extra_css %}
<style>
  .auth-wrap {
    min-height: calc(100vh - 56px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  .auth-box {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 44px 48px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 24px var(--shadow);
  }
  .auth-logo {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--ink);
    text-align: center;
    margin-bottom: 6px;
  }
  .auth-logo span { color: var(--accent2); }
  .auth-sub {
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
    margin-bottom: 32px;
    font-weight: 300;
  }
  .auth-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .auth-footer a { color: var(--accent); text-decoration: none; font-weight: 700; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap" style="margin: -40px -24px;">
  <div class="auth-box fade-in">
    <div class="auth-logo">✦ <span>Tagebuch</span></div>
    <div class="auth-sub">Konto erstellen</div>

    {% if fehler %}
      <div class="alert alert-error">{{ fehler }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('register') }}">
      <div class="form-group">
        <label for="username">Benutzername</label>
        <input type="text" id="username" name="username"
               placeholder="Wähle einen Benutzernamen" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Passwort</label>
        <input type="password" id="password" name="password"
               placeholder="Wähle ein Passwort" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">
        Konto erstellen
      </button>
    </form>

    <div class="auth-footer">
      Bereits registriert?
      <a href="{{ url_for('login') }}">Jetzt anmelden</a>
    </div>
  </div>
</div>
{% endblock %}
