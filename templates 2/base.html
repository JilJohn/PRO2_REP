<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Tagebuch{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:   #faf6f0;
      --paper:   #f5efe4;
      --warm:    #ede4d3;
      --border:  #d4c4a8;
      --ink:     #2c2416;
      --muted:   #7a6a52;
      --accent:  #8b4513;
      --accent2: #c17f3a;
      --red:     #9b2c2c;
      --green:   #2d6a4f;
      --shadow:  rgba(44,36,22,0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--cream);
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(193,127,58,0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(139,69,19,0.03) 0%, transparent 50%);
      font-family: 'Lato', sans-serif;
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      background: var(--ink);
      padding: 0 32px;
      display: flex;
      align-items: center;
      gap: 0;
      height: 56px;
      box-shadow: 0 2px 12px var(--shadow);
    }
    .nav-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: var(--cream);
      text-decoration: none;
      letter-spacing: 0.5px;
      margin-right: auto;
    }
    .nav-brand span { color: var(--accent2); }
    .nav-link {
      color: #b8a89a;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      border-bottom: 3px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .nav-link:hover { color: var(--cream); border-color: var(--accent2); }
    .nav-link.active { color: var(--cream); border-color: var(--accent2); }
    .nav-link.logout { color: #9b7070; }
    .nav-link.logout:hover { color: #e09090; border-color: var(--red); }

    /* ── LAYOUT ── */
    .page { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }

    /* ── PAGE HEADER ── */
    .page-header {
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 400;
      color: var(--ink);
      line-height: 1.2;
    }
    .page-header p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 300;
    }

    /* ── CARDS ── */
    .card {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 28px 32px;
      box-shadow: 0 2px 8px var(--shadow);
      margin-bottom: 16px;
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--accent2);
      border-radius: 4px 0 0 4px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .card:hover::before { opacity: 1; }

    /* ── FORMS ── */
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input[type="text"],
    input[type="password"],
    input[type="date"],
    textarea {
      width: 100%;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 10px 14px;
      font-family: 'Lato', sans-serif;
      font-size: 0.95rem;
      color: var(--ink);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px rgba(193,127,58,0.12);
    }
    textarea {
      resize: vertical;
      min-height: 180px;
      line-height: 1.7;
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 3px;
      font-family: 'Lato', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: var(--cream);
    }
    .btn-primary:hover { background: #7a3a0f; box-shadow: 0 3px 10px rgba(139,69,19,0.3); }
    .btn-secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--muted); color: var(--ink); }
    .btn-danger {
      background: transparent;
      color: var(--red);
      border: 1px solid rgba(155,44,44,0.3);
    }
    .btn-danger:hover { background: var(--red); color: white; }
    .btn-sm { padding: 6px 14px; font-size: 0.72rem; }

    /* ── ALERTS ── */
    .alert {
      padding: 12px 16px;
      border-radius: 3px;
      margin-bottom: 20px;
      font-size: 0.88rem;
    }
    .alert-error {
      background: #fff0f0;
      border: 1px solid rgba(155,44,44,0.3);
      color: var(--red);
    }
    .alert-success {
      background: #f0fff4;
      border: 1px solid rgba(45,106,79,0.3);
      color: var(--green);
    }

    /* ── MISC ── */
    .text-muted { color: var(--muted); font-size: 0.85rem; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    .tag {
      display: inline-block;
      background: var(--warm);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 2px;
    }
    .flex { display: flex; align-items: center; gap: 12px; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.4s ease both; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

{% if request.cookies.get('user') %}
<nav>
  <a class="nav-brand" href="{{ url_for('overview') }}">✦ <span>Tagebuch</span></a>
  <a class="nav-link {% if request.path == '/overview' %}active{% endif %}"
     href="{{ url_for('overview') }}">Übersicht</a>
  <a class="nav-link {% if request.path == '/new' %}active{% endif %}"
     href="{{ url_for('new_entry') }}">+ Eintrag</a>
  <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}"
     href="{{ url_for('dashboard') }}">Dashboard</a>
  <a class="nav-link logout" href="{{ url_for('logout') }}">Abmelden</a>
</nav>
{% endif %}

<div class="page fade-in">
  {% block content %}{% endblock %}
</div>

</body>
</html>
